<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Baseball Situation Board</title>
<style>
  :root{
    --bg:#0d141c;
    --panel:#16202b;
    --panel-2:#1e2b38;
    --line:#2a3a49;
    --ink:#eaf1f6;
    --muted:#8fa3b3;
    --accent:#e8a33d;      /* infield clay */
    --accent-red:#d7263d;  /* baseball red */
    --field-navy:#16243d;
    --runner:#ef6a2b;
    --chalk:#ffffff;
    --radius:14px;
    --tap:46px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
  }

  /* ---------- Scoreboard header ---------- */
  header{
    background:linear-gradient(180deg,#101922,#0d141c);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .board{
    display:flex;align-items:center;gap:12px;flex:1 1 340px;min-width:280px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 12px;
  }
  .board .situation{flex:1;min-width:140px;}
  .board .situation label{
    display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:2px;
  }
  #situationText{
    width:100%;background:transparent;border:none;color:var(--ink);
    font-size:16px;font-weight:700;letter-spacing:.01em;padding:2px 0;
    outline:none;
  }
  #situationText::placeholder{color:#5b6f7f;font-weight:600;}

  .outs{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:6px 12px;cursor:pointer;user-select:none;min-width:64px;
  }
  .outs .k{font-size:10px;letter-spacing:.16em;color:var(--muted);}
  .outs .num{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .outs .dots{display:flex;gap:5px;margin-top:3px;}
  .outs .dot{width:9px;height:9px;border-radius:50%;background:#33465a;}
  .outs .dot.on{background:var(--accent-red);box-shadow:0 0 6px rgba(215,38,61,.7);}

  .mini{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .mini .k{font-size:10px;letter-spacing:.16em;color:var(--muted);}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 100%;
  }
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
  .seg button{
    border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:700;letter-spacing:.02em;
    padding:8px 14px;border-radius:9px;min-height:var(--tap);cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:#241a08;box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .seg button[data-tool="arrow"].active{background:#ffd54a;color:#2a2100;}

  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-weight:600;padding:0 14px;height:var(--tap);border-radius:11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{color:var(--muted);}
  select.btn{padding-right:10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
  .hint{font-size:12px;color:var(--muted);flex:1 1 100%;line-height:1.4;}
  .hint b{color:#cdd8e1;font-weight:700;}

  /* ---------- Field ---------- */
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:none;position:relative;}

  /* floating controls in the dark corners around the field */
  .corner{position:absolute;z-index:6;display:flex;gap:6px;}
  .corner.tl{top:8px;left:8px;}
  .corner.tr{top:8px;right:8px;}
  .corner.bl{bottom:8px;left:8px;}
  .corner.br{bottom:8px;right:8px;}
  .cbtn{
    border:1px solid var(--line);background:rgba(18,27,37,.82);color:var(--ink);
    font-size:13px;font-weight:700;letter-spacing:.01em;padding:0 14px;height:42px;border-radius:12px;
    box-shadow:0 3px 10px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:inline-flex;align-items:center;gap:6px;
  }
  .cbtn:active{transform:translateY(1px);}
  select.cbtn{appearance:none;width:auto;min-width:92px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .cue{
    position:absolute;top:54px;left:50%;transform:translateX(-50%);
    max-width:86%;z-index:5;pointer-events:none;
    background:rgba(10,17,24,.8);color:#eaf1f6;border:1px solid var(--line);border-radius:20px;
    padding:7px 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.35;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(0,0,0,.4);
    opacity:0;transition:opacity .25s;
  }
  .cue.show{opacity:1;}
  .corner .seg{background:rgba(18,27,37,.82);box-shadow:0 3px 10px rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .corner .seg button{touch-action:manipulation;}
  .replay{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    width:44px;height:44px;border-radius:10px;font-size:15px;cursor:pointer;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .replay:active{transform:translateY(1px);}

  svg#field{width:100%;height:100%;touch-action:none;display:block;
    filter:drop-shadow(0 10px 24px rgba(0,0,0,.45));}
  svg#field *{touch-action:none;}
  .fielder{cursor:grab;}
  .fielder:active{cursor:grabbing;}
  /* overlays must not intercept taps meant for bases/grass/players */
  #runnersLayer,#ballLayer,#arrowsLayer,#previewLayer{pointer-events:none;}
  text{user-select:none;-webkit-user-select:none;}

  @media (max-width:560px){
    header{padding:6px 8px;gap:6px;}
    .board{flex:1 1 100%;gap:8px;padding:6px 8px;}
    .board .situation label{display:none;}
    .mini{display:none;}
    #situationText{font-size:14px;}
    .replay{width:40px;height:40px;}
    .outs{flex-direction:row;gap:6px;padding:6px 10px;min-width:0;}
    .outs .dots{margin-top:0;}
    .seg button{padding:7px 11px;min-height:40px;}
    .cbtn{height:40px;padding:0 12px;font-size:12px;}
    .corner.tl,.corner.tr{top:6px;} .corner.tl{left:6px;} .corner.tr{right:6px;}
    .corner.bl,.corner.br{bottom:6px;} .corner.bl{left:6px;} .corner.br{right:6px;}
    .stage{padding:3px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="board">
    <div class="situation">
      <label for="situationText">Situation</label>
      <input id="situationText" type="text" placeholder="Type a play, e.g. Fly ball to RF, runner on 2nd" />
    </div>

    <div class="mini">
      <div class="k">BASES</div>
      <svg width="42" height="42" viewBox="0 0 42 42" id="miniBases" aria-hidden="true">
        <rect id="mb-home" x="17" y="30" width="8" height="8" rx="1.5" transform="rotate(45 21 34)" fill="none" stroke="#4a5e70" stroke-width="1.5"/>
        <rect id="mb-1"   x="30" y="17" width="9" height="9" rx="1.5" transform="rotate(45 34.5 21.5)" fill="#33465a"/>
        <rect id="mb-2"   x="16.5" y="4" width="9" height="9" rx="1.5" transform="rotate(45 21 8.5)" fill="#33465a"/>
        <rect id="mb-3"   x="3" y="17" width="9" height="9" rx="1.5" transform="rotate(45 7.5 21.5)" fill="#33465a"/>
      </svg>
    </div>

    <button id="replayBtn" class="replay" title="Replay movement" aria-label="Replay">&#9654;</button>

    <div class="outs" id="outsBox" role="button" tabindex="0" title="Tap to change outs">
      <div class="k">OUTS</div>
      <div class="num" id="outsNum">0</div>
      <div class="dots"><span class="dot" data-i="0"></span><span class="dot" data-i="1"></span></div>
    </div>
  </div>
</header>

<div class="stage">
  <svg id="field" viewBox="150 165 700 800" preserveAspectRatio="xMidYMid meet" aria-label="Baseball field">
    <defs>
      <clipPath id="fairClip">
        <path d="M 500 880 L 5 385 A 700 700 0 0 1 995 385 Z"/>
      </clipPath>
      <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#ffd54a" stroke="#7a5c00" stroke-width="0.6"/>
      </marker>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <filter id="tokenShadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06140c" flood-opacity="0.5"/>
      </filter>
      <linearGradient id="tokenSheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="vignette" cx="50%" cy="60%" r="72%">
        <stop offset="0" stop-color="#000000" stop-opacity="0"/>
        <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
      </radialGradient>
    </defs>

    <!-- beyond the fence -->
    <rect x="0" y="0" width="1000" height="1000" fill="#0d141c"/>

    <!-- fair territory grass + warning track + mow rings (clipped to the fair wedge) -->
    <g clip-path="url(#fairClip)">
      <circle cx="500" cy="880" r="700" fill="#c68a4e"/> <!-- warning track base -->
      <g id="grassRings"></g>
    </g>

    <!-- fence -->
    <path d="M 5 385 A 700 700 0 0 1 995 385" fill="none" stroke="#12331f" stroke-width="10" stroke-linecap="round"/>
    <path d="M 5 385 A 700 700 0 0 1 995 385" fill="none" stroke="#eecb59" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

    <!-- depth vignette (over grass only) -->
    <rect x="0" y="0" width="1000" height="1000" fill="url(#vignette)" pointer-events="none"/>

    <!-- infield dirt skin (rounded: semicircular grass line) -->
    <path d="M 500 916 L 746 670 A 246 246 0 0 0 254 670 Z"
          fill="#c58a54" stroke="#a56a37" stroke-width="5" stroke-linejoin="round"/>
    <!-- infield grass (diamond between the base paths) -->
    <path d="M 500 510 L 660 670 L 500 830 L 340 670 Z" fill="#348a3d" stroke="#2c7a35" stroke-width="2"/>
    <!-- home dirt circle + batter's boxes -->
    <circle cx="500" cy="880" r="58" fill="#c58a54"/>
    <rect x="446" y="852" width="18" height="50" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
    <rect x="536" y="852" width="18" height="50" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".8"/>
    <!-- pitcher's mound -->
    <circle cx="500" cy="662" r="36" fill="#d29a5f" stroke="#b47c46" stroke-width="2"/>
    <rect x="486" y="658" width="28" height="8" rx="2" fill="#f2f4f6"/>

    <!-- foul lines -->
    <line x1="500" y1="880" x2="995" y2="385" stroke="#ffffff" stroke-width="5"/>
    <line x1="500" y1="880" x2="5"   y2="385" stroke="#ffffff" stroke-width="5"/>

    <!-- bases -->
    <rect x="697" y="657" width="26" height="26" rx="2.5" transform="rotate(45 710 670)" fill="#fff" stroke="#d7dde2"/>
    <rect x="487" y="447" width="26" height="26" rx="2.5" transform="rotate(45 500 460)" fill="#fff" stroke="#d7dde2"/>
    <rect x="277" y="657" width="26" height="26" rx="2.5" transform="rotate(45 290 670)" fill="#fff" stroke="#d7dde2"/>
    <!-- home plate -->
    <path d="M 485 865 L 515 865 L 515 884 L 500 897 L 485 884 Z" fill="#fff" stroke="#d7dde2"/>

    <!-- interactive base tap zones (above field, below players) -->
    <g id="baseZones">
      <circle data-base="1" cx="710" cy="670" r="46" fill="transparent"/>
      <circle data-base="2" cx="500" cy="460" r="46" fill="transparent"/>
      <circle data-base="3" cx="290" cy="670" r="46" fill="transparent"/>
    </g>

    <!-- dynamic layers -->
    <g id="arrowsLayer"></g>
    <g id="previewLayer"></g>
    <g id="runnersLayer"></g>
    <g id="ballLayer"></g>
    <g id="fieldersLayer"></g>
  </svg>

  <div class="corner tl">
    <div class="seg" role="group" aria-label="Tool">
      <button data-tool="move" class="active">Move</button>
      <button data-tool="arrow">Arrow</button>
    </div>
  </div>
  <div class="corner tr">
    <select class="cbtn" id="presets" aria-label="Load a situation">
      <option value="">Load…</option>
    </select>
  </div>
  <div class="corner bl">
    <button class="cbtn" id="resetPlayers">Reset</button>
  </div>
  <div class="corner br">
    <button class="cbtn" id="clearMarks">Clear</button>
  </div>
  <div class="cue" id="cueBar" aria-live="polite"></div>
</div>

<script>
(function(){
  "use strict";

  var svg = document.getElementById('field');
  var NS = "http://www.w3.org/2000/svg";

  /* ---------- geometry ---------- */
  var HOME={x:500,y:880}, FIRST={x:710,y:670}, SECOND={x:500,y:460}, THIRD={x:290,y:670};
  var BASE_XY={1:FIRST,2:SECOND,3:THIRD};

  /* ---------- mow rings ---------- */
  var rings=document.getElementById('grassRings');
  var A="#3c8f42", B="#2f7c37", i=0;
  for(var r=660;r>=60;r-=66){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',500);c.setAttribute('cy',880);c.setAttribute('r',r);
    c.setAttribute('fill', (i%2===0)?A:B);
    rings.appendChild(c); i++;
  }

  /* ---------- state ---------- */
  var fielders=[
    {id:'LF',x:300,y:335},{id:'CF',x:500,y:262},{id:'RF',x:700,y:335},
    {id:'SS',x:388,y:482},{id:'2B',x:612,y:482},
    {id:'3B',x:330,y:616},{id:'1B',x:670,y:616},
    {id:'P',x:500,y:662},{id:'C',x:500,y:928}
  ];
  // position-group colors: battery=red, infield=blue, outfield=teal
  var COLORS={P:'#c0392b',C:'#c0392b','1B':'#1d4e89','2B':'#1d4e89','3B':'#1d4e89',SS:'#1d4e89',LF:'#0e7c6b',CF:'#0e7c6b',RF:'#0e7c6b'};
  var defaults=fielders.map(function(f){return {id:f.id,x:f.x,y:f.y};});
  var runners={1:false,2:false,3:false};
  var outs=0;
  var ball=null;              // {x,y}
  var arrows=[];              // {x1,y1,x2,y2}
  var tool='move';           // 'move' | 'arrow'

  /* ---------- helpers ---------- */
  function el(tag,attrs){
    var n=document.createElementNS(NS,tag);
    for(var k in attrs){ n.setAttribute(k,attrs[k]); }
    return n;
  }
  function clampX(v){ return Math.max(185,Math.min(815,v)); }
  function clampY(v){ return Math.max(200,Math.min(930,v)); }
  function toSvg(evt){
    var pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
    var p=pt.matrixTransform(svg.getScreenCTM().inverse());
    return {x:p.x,y:p.y};
  }

  /* ---------- fielders ---------- */
  var fLayer=document.getElementById('fieldersLayer');
  function buildFielders(){
    fLayer.textContent='';
    fielders.forEach(function(f){
      var color=COLORS[f.id]||'#1d4e89';
      var g=el('g',{'class':'fielder','data-fielder':f.id,'transform':'translate('+f.x+','+f.y+')','filter':'url(#tokenShadow)'});
      g.appendChild(el('circle',{r:44,fill:'transparent'}));                          // large grab target
      g.appendChild(el('circle',{r:33,fill:color,stroke:'#ffffff','stroke-width':3.5})); // body
      g.appendChild(el('circle',{r:33,fill:'url(#tokenSheen)'}));                       // top highlight
      var t=el('text',{'text-anchor':'middle','dy':'0.34em','fill':'#ffffff','font-size':'22','font-weight':'800','font-family':'system-ui,sans-serif','letter-spacing':'0.5'});
      t.textContent=f.id; g.appendChild(t);
      f.node=g; fLayer.appendChild(g);
    });
  }
  function setFielderPos(f){ f.node.setAttribute('transform','translate('+f.x+','+f.y+')'); }
  function getFielder(id){ for(var j=0;j<fielders.length;j++){ if(fielders[j].id===id) return fielders[j]; } return null; }

  /* ---------- runners ---------- */
  var rLayer=document.getElementById('runnersLayer');
  function renderRunners(){
    rLayer.textContent='';
    for(var b=1;b<=3;b++){
      if(!runners[b]) continue;
      var base=BASE_XY[b];
      var dx=HOME.x-base.x, dy=HOME.y-base.y, len=Math.hypot(dx,dy);
      var ox=base.x+dx/len*20, oy=base.y+dy/len*20;
      var g=el('g',{'transform':'translate('+ox+','+oy+')','filter':'url(#tokenShadow)'});
      g.appendChild(el('circle',{r:22,fill:'#ff7a1a',stroke:'#fff','stroke-width':3}));
      var t=el('text',{'text-anchor':'middle','dy':'0.34em','fill':'#fff','font-size':'17','font-weight':'800','font-family':'system-ui'});
      t.textContent='R'; g.appendChild(t);
      rLayer.appendChild(g);
    }
    // mini scoreboard bases
    document.getElementById('mb-1').setAttribute('fill',runners[1]?'#ff7a1a':'#33465a');
    document.getElementById('mb-2').setAttribute('fill',runners[2]?'#ff7a1a':'#33465a');
    document.getElementById('mb-3').setAttribute('fill',runners[3]?'#ff7a1a':'#33465a');
  }
  function toggleRunner(b){ runners[b]=!runners[b]; renderRunners(); }

  /* ---------- ball ---------- */
  var bLayer=document.getElementById('ballLayer');
  function renderBall(){
    bLayer.textContent='';
    if(!ball) return;
    var g=el('g',{'transform':'translate('+ball.x+','+ball.y+')','filter':'url(#tokenShadow)'});
    g.appendChild(el('circle',{r:15,fill:'#fff',stroke:'#c9ccd1','stroke-width':1.5}));
    g.appendChild(el('path',{d:'M -8 -7 A 12 12 0 0 1 -8 7',fill:'none',stroke:'#d7263d','stroke-width':1.8}));
    g.appendChild(el('path',{d:'M 8 -7 A 12 12 0 0 0 8 7',fill:'none',stroke:'#d7263d','stroke-width':1.8}));
    bLayer.appendChild(g);
  }
  function setBall(p){ ball={x:clampX(p.x),y:clampY(p.y)}; renderBall(); }

  /* ---------- arrows ---------- */
  var aLayer=document.getElementById('arrowsLayer');
  var pLayer=document.getElementById('previewLayer');
  function arrowNode(a,preview){
    var g=el('g',{});
    g.appendChild(el('line',{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,stroke:'#3a2e00','stroke-width':8,'stroke-linecap':'round',opacity:preview?0.4:0.55}));
    g.appendChild(el('line',{x1:a.x1,y1:a.y1,x2:a.x2,y2:a.y2,stroke:'#ffd54a','stroke-width':5,'stroke-linecap':'round','marker-end':'url(#arrowHead)',opacity:preview?0.7:1}));
    return g;
  }
  function renderArrows(){
    aLayer.textContent='';
    arrows.forEach(function(a){ aLayer.appendChild(arrowNode(a,false)); });
  }
  function showPreview(a){ pLayer.textContent=''; pLayer.appendChild(arrowNode(a,true)); }
  function clearPreview(){ pLayer.textContent=''; }

  /* ---------- outs ---------- */
  function renderOuts(){
    document.getElementById('outsNum').textContent=outs;
    var dots=document.querySelectorAll('.outs .dot');
    dots.forEach(function(d){ d.classList.toggle('on', Number(d.getAttribute('data-i'))<outs); });
  }
  document.getElementById('outsBox').addEventListener('click',function(){ outs=(outs+1)%3; renderOuts(); });

  /* ---------- pointer interaction ---------- */
  var active=null, startClient=null, moved=false;

  svg.addEventListener('pointerdown',function(e){
    var p=toSvg(e);
    startClient={x:e.clientX,y:e.clientY}; moved=false;
    var fEl=e.target.closest('[data-fielder]');

    if(tool==='arrow'){
      active={type:'arrow',x1:p.x,y1:p.y,x2:p.x,y2:p.y};
      showPreview(active);
    } else if(fEl){
      stopAnim();
      var f=getFielder(fEl.getAttribute('data-fielder'));
      active={type:'fielder',f:f,offx:p.x-f.x,offy:p.y-f.y};
      f.node.setAttribute('filter','');
    } else {
      active={type:'tap',p:p,target:e.target};
    }
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    e.preventDefault();
  });

  svg.addEventListener('pointermove',function(e){
    if(!active) return;
    var p=toSvg(e);
    if(Math.hypot(e.clientX-startClient.x,e.clientY-startClient.y)>6) moved=true;
    if(active.type==='fielder'){
      active.f.x=clampX(p.x-active.offx); active.f.y=clampY(p.y-active.offy);
      setFielderPos(active.f);
    } else if(active.type==='arrow'){
      active.x2=p.x; active.y2=p.y; showPreview(active);
    }
    e.preventDefault();
  });

  function finish(e){
    if(!active) return;
    if(active.type==='arrow'){
      clearPreview();
      if(Math.hypot(active.x2-active.x1,active.y2-active.y1)>20){
        arrows.push({x1:active.x1,y1:active.y1,x2:active.x2,y2:active.y2});
        renderArrows();
      }
    } else if(active.type==='fielder'){
      active.f.node.setAttribute('filter','url(#tokenShadow)');
    } else if(active.type==='tap' && !moved){
      var baseEl=active.target.closest('[data-base]');
      if(baseEl){ toggleRunner(baseEl.getAttribute('data-base')); }
      else { setBall(active.p); }
    }
    active=null;
    try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
  }
  svg.addEventListener('pointerup',function(e){ finish(e); e.preventDefault(); });
  svg.addEventListener('pointercancel',function(e){ clearPreview(); if(active&&active.type==='fielder'){active.f.node.setAttribute('filter','url(#tokenShadow)');} active=null; });

  // Hard stop: the field area never scrolls (covers older touch handling too)
  document.querySelector('.stage').addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});

  /* ---------- tool toggle (Move / Arrow) ---------- */
  var segBtns=document.querySelectorAll('.seg button');
  segBtns.forEach(function(btn){
    btn.addEventListener('click',function(){
      tool=btn.getAttribute('data-tool');
      segBtns.forEach(function(b){ b.classList.toggle('active', b===btn); });
    });
  });

  var situationInput=document.getElementById('situationText');
  var cueEl=document.getElementById('cueBar');

  /* ---------- coaching cue text per situation ---------- */
  var CUES={
    'Ground ball to SS':'SS fields → throw to 1B (1B covers)',
    'Ground ball to 2B':'2B fields → throw to 1B (1B covers)',
    'Ground ball to 3B':'3B fields → throw across to 1B',
    'Ground ball to 1B':'1B fields → P covers first',
    'Comebacker to the pitcher':'P fields → throw to 1B',
    'Slow roller to 3B':'3B charges → barehand → throw to 1B',
    'Pop fly to shortstop':'SS calls it → everyone clears',
    'Fly ball to left field':'LF catches → CF backs up',
    'Fly ball to center field':'CF catches → LF & RF back up',
    'Fly ball to right field':'RF catches → CF backs up',
    'Pop-up between 1B and 2B':'2B calls it → RF backs up',
    'Foul pop near first base':'1B catches → 2B covers first',
    'Base hit to left field':'LF fields → SS is cutoff → 2B covers 2nd',
    'Base hit to center field':'CF fields → SS is cutoff → 2B covers 2nd',
    'Base hit to right field':'RF fields → 2B is cutoff → SS covers 2nd',
    'Runner on 1st — hit to RF (throw to 3rd)':'RF fields → throw to 3B → SS is cutoff',
    'Runner on 1st — grounder to SS (turn two)':'SS → 2B covers & turns → throw to 1B',
    'Runner on 1st — grounder to 2B (turn two)':'2B → SS covers & turns → throw to 1B',
    'Runner on 1st — grounder to 3B':'3B → SS covers 2nd (force) → then 1B',
    'Runner on 2nd — grounder to SS':'SS looks runner back → throw to 1B',
    'Runner on 3rd, infield in — grounder to SS':'SS fields → throw home (C covers)',
    '1st & 2nd — grounder to 3B (force at third)':'3B steps on third (force) → then 1B',
    'Bases loaded — grounder to SS (force at home)':'SS → throw home (force) → C covers',
    'Runner on 3rd — medium fly to CF (tag up)':'CF catches → throw home → 1B cutoff → C covers',
    'Runner on 2nd — fly to RF (tag to 3rd)':'RF catches → throw to 3B → SS cutoff',
    'Runner on 1st — deep fly to RF':'RF catches → hit the relay → 2B covers 2nd',
    'Runner on 1st — sacrifice bunt':'P/3B field bunt → out at 1B (SS covers 2nd)',
    'Runner on 2nd — sacrifice bunt':'P fields → out at 1B → watch runner to 3rd',
    'Squeeze — runner on 3rd bunts':'P fields → throw home → C covers plate',
    'Runner steals second — throw down':'C throws down → SS covers 2nd → CF backs up'
  };

  /* ---------- reusable target spots (coverage / backups) ---------- */
  var AT={
    first:{x:702,y:650}, second:{x:500,y:498}, third:{x:314,y:650}, home:{x:500,y:852},
    backFirst:{x:772,y:706}, backThird:{x:232,y:706}, backSecond:{x:500,y:410}, backHome:{x:500,y:922}
  };
  function defaultOf(id){ for(var j=0;j<defaults.length;j++){ if(defaults[j].id===id) return defaults[j]; } return null; }

  /* ---------- preset situations (ball + where each player moves) ---------- */
  var PRESETS=[
    // --- Ground balls (bases empty) ---
    {g:'Ground balls', name:'Ground ball to SS', runners:[], outs:0, ball:{x:420,y:515},
      moves:{SS:{x:420,y:515}, '1B':AT.first, RF:AT.backFirst}},
    {g:'Ground balls', name:'Ground ball to 2B', runners:[], outs:0, ball:{x:596,y:515},
      moves:{'2B':{x:596,y:515}, '1B':AT.first, RF:AT.backFirst}},
    {g:'Ground balls', name:'Ground ball to 3B', runners:[], outs:0, ball:{x:350,y:600},
      moves:{'3B':{x:350,y:600}, '1B':AT.first, RF:AT.backFirst}},
    {g:'Ground balls', name:'Ground ball to 1B', runners:[], outs:0, ball:{x:655,y:625},
      moves:{'1B':{x:655,y:625}, P:AT.first, RF:AT.backFirst}},
    {g:'Ground balls', name:'Comebacker to the pitcher', runners:[], outs:0, ball:{x:500,y:636},
      moves:{P:{x:500,y:636}, '1B':AT.first, RF:AT.backFirst}},
    {g:'Ground balls', name:'Slow roller to 3B', runners:[], outs:0, ball:{x:380,y:720},
      moves:{'3B':{x:380,y:720}, '1B':AT.first, RF:AT.backFirst}},

    // --- Fly balls & pop-ups ---
    {g:'Fly balls & pop-ups', name:'Pop fly to shortstop', runners:[], outs:0, ball:{x:400,y:500},
      moves:{SS:{x:400,y:500}, CF:{x:460,y:432}}},
    {g:'Fly balls & pop-ups', name:'Fly ball to left field', runners:[], outs:0, ball:{x:255,y:320},
      moves:{LF:{x:255,y:320}, CF:{x:410,y:300}}},
    {g:'Fly balls & pop-ups', name:'Fly ball to center field', runners:[], outs:0, ball:{x:500,y:285},
      moves:{CF:{x:500,y:285}, LF:{x:405,y:320}, RF:{x:595,y:320}}},
    {g:'Fly balls & pop-ups', name:'Fly ball to right field', runners:[], outs:0, ball:{x:750,y:330},
      moves:{RF:{x:750,y:330}, CF:{x:600,y:300}}},
    {g:'Fly balls & pop-ups', name:'Pop-up between 1B and 2B', runners:[], outs:0, ball:{x:605,y:545},
      moves:{'2B':{x:605,y:545}, RF:{x:700,y:460}}},
    {g:'Fly balls & pop-ups', name:'Foul pop near first base', runners:[], outs:0, ball:{x:772,y:640},
      moves:{'1B':{x:772,y:640}, '2B':AT.first}},

    // --- Base hits (cutoffs) ---
    {g:'Base hits (cutoffs)', name:'Base hit to left field', runners:[], outs:0, ball:{x:245,y:360},
      moves:{LF:{x:245,y:360}, SS:{x:410,y:470}, '2B':AT.second}},
    {g:'Base hits (cutoffs)', name:'Base hit to center field', runners:[], outs:0, ball:{x:510,y:325},
      moves:{CF:{x:510,y:325}, SS:{x:455,y:500}, '2B':AT.second}},
    {g:'Base hits (cutoffs)', name:'Base hit to right field', runners:[], outs:0, ball:{x:760,y:370},
      moves:{RF:{x:760,y:370}, '2B':{x:560,y:470}, SS:AT.second}},
    {g:'Base hits (cutoffs)', name:'Runner on 1st — hit to RF (throw to 3rd)', runners:[1], outs:0, ball:{x:760,y:370},
      moves:{RF:{x:760,y:370}, '3B':AT.third, SS:{x:470,y:540}}},

    // --- With runners ---
    {g:'With runners', name:'Runner on 1st — grounder to SS (turn two)', runners:[1], outs:0, ball:{x:420,y:515},
      moves:{SS:{x:420,y:515}, '2B':AT.second, '1B':AT.first}},
    {g:'With runners', name:'Runner on 1st — grounder to 2B (turn two)', runners:[1], outs:0, ball:{x:596,y:515},
      moves:{'2B':{x:596,y:515}, SS:AT.second, '1B':AT.first}},
    {g:'With runners', name:'Runner on 1st — grounder to 3B', runners:[1], outs:0, ball:{x:350,y:600},
      moves:{'3B':{x:350,y:600}, SS:AT.second, '1B':AT.first}},
    {g:'With runners', name:'Runner on 2nd — grounder to SS', runners:[2], outs:0, ball:{x:420,y:515},
      moves:{SS:{x:420,y:515}, '1B':AT.first, '3B':AT.third}},
    {g:'With runners', name:'Runner on 3rd, infield in — grounder to SS', runners:[3], outs:1, ball:{x:425,y:530},
      moves:{SS:{x:425,y:530}, C:AT.home}},
    {g:'With runners', name:'1st & 2nd — grounder to 3B (force at third)', runners:[1,2], outs:0, ball:{x:345,y:600},
      moves:{'3B':AT.third, '1B':AT.first, SS:AT.second}},
    {g:'With runners', name:'Bases loaded — grounder to SS (force at home)', runners:[1,2,3], outs:1, ball:{x:420,y:515},
      moves:{SS:{x:420,y:515}, C:AT.home, '2B':AT.second}},
    {g:'With runners', name:'Runner on 3rd — medium fly to CF (tag up)', runners:[3], outs:1, ball:{x:500,y:320},
      moves:{CF:{x:500,y:320}, '1B':{x:560,y:704}, C:AT.home}},
    {g:'With runners', name:'Runner on 2nd — fly to RF (tag to 3rd)', runners:[2], outs:1, ball:{x:755,y:340},
      moves:{RF:{x:755,y:340}, '3B':AT.third, SS:{x:450,y:560}}},
    {g:'With runners', name:'Runner on 1st — deep fly to RF', runners:[1], outs:1, ball:{x:768,y:300},
      moves:{RF:{x:768,y:300}, '2B':AT.second, SS:{x:520,y:490}}},

    // --- Bunts ---
    {g:'Bunts', name:'Runner on 1st — sacrifice bunt', runners:[1], outs:0, ball:{x:445,y:790},
      moves:{P:{x:445,y:790}, '3B':{x:365,y:700}, '1B':AT.first, SS:AT.second}},
    {g:'Bunts', name:'Runner on 2nd — sacrifice bunt', runners:[2], outs:0, ball:{x:430,y:780},
      moves:{P:{x:430,y:780}, '1B':AT.first, '3B':AT.third}},
    {g:'Bunts', name:'Squeeze — runner on 3rd bunts', runners:[3], outs:1, ball:{x:475,y:800},
      moves:{P:{x:475,y:800}, C:AT.home, '1B':AT.first}},

    // --- Steals & extras ---
    {g:'Steals & extras', name:'Runner steals second — throw down', runners:[1], outs:1, ball:null,
      moves:{SS:AT.second, CF:AT.backSecond}}
  ];

  var sel=document.getElementById('presets');
  var groups={};
  PRESETS.forEach(function(pre,idx){
    var gname=pre.g||'Situations';
    if(!groups[gname]){ var og=document.createElement('optgroup'); og.label=gname; sel.appendChild(og); groups[gname]=og; }
    var o=document.createElement('option'); o.value=idx; o.textContent=pre.name; groups[gname].appendChild(o);
  });

  /* ---------- animation ---------- */
  var currentSituation=null, animRAF=null;
  function stopAnim(){ if(animRAF){ cancelAnimationFrame(animRAF); animRAF=null; } }
  function animateMovers(movers){
    stopAnim();
    var dur=900, start=null;
    function ease(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
    function step(ts){
      if(start===null) start=ts;
      var t=Math.min(1,(ts-start)/dur), e=ease(t);
      movers.forEach(function(m){ m.f.x=m.x0+(m.x1-m.x0)*e; m.f.y=m.y0+(m.y1-m.y0)*e; setFielderPos(m.f); });
      if(t<1){ animRAF=requestAnimationFrame(step); } else { animRAF=null; }
    }
    animRAF=requestAnimationFrame(step);
  }
  function loadSituation(pre, animate){
    stopAnim();
    // start from standard alignment
    defaults.forEach(function(d){ var f=getFielder(d.id); f.x=d.x; f.y=d.y; setFielderPos(f); });
    // scenario
    runners={1:false,2:false,3:false};
    (pre.runners||[]).forEach(function(b){ runners[b]=true; });
    outs=pre.outs||0;
    ball = pre.ball ? {x:pre.ball.x,y:pre.ball.y} : null;
    situationInput.value=pre.name;
    arrows=[];
    // movement arrows + movers
    var movers=[], moves=pre.moves||{};
    Object.keys(moves).forEach(function(id){
      var f=getFielder(id); if(!f) return;
      var d=defaultOf(id), t=moves[id];
      if(Math.hypot(t.x-d.x,t.y-d.y)>6){ arrows.push({x1:d.x,y1:d.y,x2:t.x,y2:t.y}); }
      movers.push({f:f,x0:d.x,y0:d.y,x1:t.x,y1:t.y});
    });
    renderRunners(); renderOuts(); renderBall(); renderArrows();
    cueEl.textContent = CUES[pre.name] || pre.name || '';
    cueEl.classList.toggle('show', !!cueEl.textContent);
    if(animate){ animateMovers(movers); }
    else { movers.forEach(function(m){ m.f.x=m.x1; m.f.y=m.y1; setFielderPos(m.f); }); }
    currentSituation=pre;
  }

  sel.addEventListener('change',function(){
    if(sel.value==='') return;
    loadSituation(PRESETS[Number(sel.value)], true);
    sel.selectedIndex=0;            // keep the control compact ("Load…")
    try{ sel.blur(); }catch(_){}
  });
  document.getElementById('replayBtn').addEventListener('click',function(){
    if(currentSituation) loadSituation(currentSituation, true);
  });

  /* ---------- reset / clear ---------- */
  document.getElementById('resetPlayers').addEventListener('click',function(){
    stopAnim();
    defaults.forEach(function(d){ var f=getFielder(d.id); f.x=d.x; f.y=d.y; setFielderPos(f); });
    runners={1:false,2:false,3:false}; outs=0; ball=null; arrows=[];
    situationInput.value=''; sel.selectedIndex=0; currentSituation=null;
    cueEl.textContent=''; cueEl.classList.remove('show');
    renderRunners(); renderOuts(); renderBall(); renderArrows();
  });
  document.getElementById('clearMarks').addEventListener('click',function(){
    arrows=[]; renderArrows();
  });

  /* ---------- init ---------- */
  buildFielders();
  renderRunners(); renderBall(); renderArrows(); renderOuts();
})();
</script>
