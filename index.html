<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Situation Board</title>
<style>
  :root{
    --navy:#13233f;
    --navy-dark:#0d1b2a;
    --gold:#f4b400;
    --grass:#2f8f3f;
    --grass-dark:#2a7f38;
    --dirt:#c2915b;
    --line:#f5f5f5;
  }
  html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    background:var(--navy-dark);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed;
    touch-action:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100%;
    width:100%;
  }
  header{
    flex:0 0 auto;
    padding:10px 14px 2px;
    color:#fff;
    text-align:center;
  }
  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:0.5px;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:#9fb0c9;
  }
  #toolbar{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    padding:8px 10px;
    background:var(--navy);
    border-bottom:2px solid #0a1626;
  }
  #toolbar button, #toolbar select{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    background:#1e3357;
    color:#fff;
  }
  #toolbar button:active{ background:#2a4675; }
  #toolbar button.active{
    background:var(--gold);
    color:#20304f;
  }
  #toolbar button.danger{ background:#7a2323; }
  #toolbar button.danger:active{ background:#932c2c; }
  #toolbar select{
    background:#1e3357;
    color:#fff;
  }
  #toolbar .spacer{ flex:1 1 auto; }
  #field-wrap{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
    min-height:0;
    padding:6px;
    box-sizing:border-box;
  }
  #field{
    width:100%;
    height:100%;
    max-width:1200px;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
  }
  .player{ cursor:grab; touch-action:none; }
  .player:active{ cursor:grabbing; }
  .player circle.body{ stroke:#fff; stroke-width:2; }
  .player text{
    fill:#fff;
    font-size:15px;
    font-weight:700;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
    user-select:none;
  }
  .base-hit{ cursor:pointer; touch-action:none; }
  .runner{ pointer-events:none; }
  .runner text{
    fill:#20304f;
    font-size:11px;
    font-weight:800;
    text-anchor:middle;
    dominant-baseline:central;
  }
  #outs-badge{ cursor:pointer; touch-action:none; }
  .arrow{
    stroke:#e63946;
    stroke-width:5;
    stroke-linecap:round;
    fill:none;
  }
  #grass-bg{ touch-action:none; }
  #ball-mark{ pointer-events:none; }
  .field-label{
    font-size:11px;
    fill:#eaf3ea;
    opacity:0.85;
    text-anchor:middle;
    pointer-events:none;
    user-select:none;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>&#9918; Situation Board</h1>
    <p>Drag players &bull; Tap a base for a runner &bull; Tap grass to drop the ball &bull; Tap OUTS to cycle</p>
  </header>

  <div id="toolbar">
    <button id="btn-draw" type="button">&#9998; Draw Arrows</button>
    <button id="btn-clear" type="button">Clear Drawing</button>
    <select id="preset-select">
      <option value="">Preset Situation&hellip;</option>
    </select>
    <div class="spacer"></div>
    <button id="btn-reset" class="danger" type="button">Reset</button>
  </div>

  <div id="field-wrap">
    <svg id="field" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet">
      <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#e63946"></path>
        </marker>
        <linearGradient id="grassStripes" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="var(--grass)"></stop>
          <stop offset="1" stop-color="var(--grass-dark)"></stop>
        </linearGradient>
      </defs>

      <!-- Grass background (also the tap target for placing the ball / drawing arrows) -->
      <rect id="grass-bg" x="0" y="0" width="800" height="600" fill="var(--grass)"></rect>
      <!-- mowed stripes for texture (decorative, non-interactive) -->
      <g pointer-events="none" opacity="0.10">
        <rect x="0" y="0" width="80" height="600" fill="#000"></rect>
        <rect x="160" y="0" width="80" height="600" fill="#000"></rect>
        <rect x="320" y="0" width="80" height="600" fill="#000"></rect>
        <rect x="480" y="0" width="80" height="600" fill="#000"></rect>
        <rect x="640" y="0" width="80" height="600" fill="#000"></rect>
      </g>

      <!-- Outfield fence arc (decorative) -->
      <path d="M 60,600 A 460,460 0 0 1 740,600" fill="none" stroke="#e9e9e9" stroke-width="4" stroke-dasharray="2 10" opacity="0.6" pointer-events="none"></path>

      <!-- Foul lines -->
      <g pointer-events="none">
        <line x1="400" y1="560" x2="748" y2="212" stroke="var(--line)" stroke-width="4"></line>
        <line x1="400" y1="560" x2="52" y2="212" stroke="var(--line)" stroke-width="4"></line>
      </g>

      <!-- Infield dirt -->
      <polygon points="400,598 562,398 400,235 238,398" fill="var(--dirt)" stroke="#a97a45" stroke-width="2" pointer-events="none"></polygon>

      <!-- Base paths (dirt strips) -->
      <g stroke="var(--dirt)" stroke-width="14" opacity="0.9" pointer-events="none">
        <line x1="400" y1="560" x2="516" y2="444"></line>
        <line x1="516" y1="444" x2="400" y2="328"></line>
        <line x1="400" y1="328" x2="284" y2="444"></line>
        <line x1="284" y1="444" x2="400" y2="560"></line>
      </g>

      <!-- Pitcher's mound -->
      <g pointer-events="none">
        <circle cx="400" cy="450" r="26" fill="var(--dirt)" stroke="#a97a45" stroke-width="2"></circle>
        <rect x="392" y="446" width="16" height="6" fill="#f5f5f5"></rect>
      </g>

      <!-- Bases (tap targets) -->
      <g id="bases-layer">
        <g class="base-hit" data-base="first">
          <rect x="-13" y="-13" width="26" height="26" transform="translate(516,444) rotate(45)" fill="var(--line)" stroke="#333" stroke-width="1.5"></rect>
          <circle cx="516" cy="444" r="22" fill="transparent"></circle>
        </g>
        <g class="base-hit" data-base="second">
          <rect x="-13" y="-13" width="26" height="26" transform="translate(400,328) rotate(45)" fill="var(--line)" stroke="#333" stroke-width="1.5"></rect>
          <circle cx="400" cy="328" r="22" fill="transparent"></circle>
        </g>
        <g class="base-hit" data-base="third">
          <rect x="-13" y="-13" width="26" height="26" transform="translate(284,444) rotate(45)" fill="var(--line)" stroke="#333" stroke-width="1.5"></rect>
          <circle cx="284" cy="444" r="22" fill="transparent"></circle>
        </g>
      </g>

      <!-- Home plate -->
      <g pointer-events="none">
        <polygon points="388,550 412,550 412,560 400,570 388,560" fill="var(--line)" stroke="#333" stroke-width="1.5" transform="translate(0,0)"></polygon>
      </g>

      <!-- Drawing layer for arrows -->
      <g id="arrows-layer"></g>

      <!-- Runner markers (hidden until toggled on) -->
      <g id="runners-layer">
        <g class="runner" id="runner-first" transform="translate(516,444)" style="display:none">
          <circle r="12" fill="var(--gold)" stroke="#20304f" stroke-width="2"></circle>
          <text y="0">R</text>
        </g>
        <g class="runner" id="runner-second" transform="translate(400,328)" style="display:none">
          <circle r="12" fill="var(--gold)" stroke="#20304f" stroke-width="2"></circle>
          <text y="0">R</text>
        </g>
        <g class="runner" id="runner-third" transform="translate(284,444)" style="display:none">
          <circle r="12" fill="var(--gold)" stroke="#20304f" stroke-width="2"></circle>
          <text y="0">R</text>
        </g>
      </g>

      <!-- Ball -->
      <g id="ball-mark" transform="translate(400,500)">
        <circle r="8" fill="#ffffff" stroke="#333" stroke-width="1.5"></circle>
        <path d="M -4,-3 Q 0,0 -4,3 M 4,-3 Q 0,0 4,3" stroke="#c0392b" stroke-width="1" fill="none"></path>
      </g>

      <!-- Defensive players (draggable) -->
      <g id="players-layer"></g>

      <!-- Outs indicator badge -->
      <g id="outs-badge" transform="translate(20,20)">
        <rect x="0" y="0" width="110" height="56" rx="10" fill="var(--navy)" stroke="#fff" stroke-width="1.5"></rect>
        <text x="55" y="17" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">OUTS</text>
        <circle id="out-light-1" cx="38" cy="39" r="10" fill="#3a4a6b" stroke="#fff" stroke-width="1.5"></circle>
        <circle id="out-light-2" cx="72" cy="39" r="10" fill="#3a4a6b" stroke="#fff" stroke-width="1.5"></circle>
      </g>
    </svg>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SVG_NS = "http://www.w3.org/2000/svg";
  var svg = document.getElementById("field");
  var playersLayer = document.getElementById("players-layer");
  var arrowsLayer = document.getElementById("arrows-layer");
  var grassBg = document.getElementById("grass-bg");
  var ballMark = document.getElementById("ball-mark");

  var PAD_X = 20, PAD_Y = 20, MAX_X = 780, MAX_Y = 590;
  var PLAYER_R = 17;

  var DEFAULT_PLAYERS = {
    P:  {x:400, y:450, color:"#7a2323"},
    C:  {x:400, y:580, color:"#7a2323"},
    "1B": {x:500, y:410, color:"#1e3357"},
    "2B": {x:460, y:350, color:"#1e3357"},
    SS: {x:340, y:350, color:"#1e3357"},
    "3B": {x:300, y:410, color:"#1e3357"},
    LF: {x:170, y:230, color:"#2d5a2d"},
    CF: {x:400, y:140, color:"#2d5a2d"},
    RF: {x:630, y:230, color:"#2d5a2d"}
  };
  var DEFAULT_BALL = {x:400, y:500};

  var players = {};
  var runners = {first:false, second:false, third:false};
  var outs = 0;
  var drawMode = false;

  var dragTarget = null;   // {el, state}
  var drawingArrow = null; // {line}
  var pendingTap = null;   // {type, key, x0, y0}

  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function svgPoint(evt){
    var pt = svg.createSVGPoint();
    pt.x = evt.clientX;
    pt.y = evt.clientY;
    var ctm = svg.getScreenCTM().inverse();
    return pt.matrixTransform(ctm);
  }

  // ---------- Players ----------
  function buildPlayers(){
    playersLayer.innerHTML = "";
    players = {};
    Object.keys(DEFAULT_PLAYERS).forEach(function(id){
      var d = DEFAULT_PLAYERS[id];
      players[id] = {x:d.x, y:d.y};

      var g = document.createElementNS(SVG_NS, "g");
      g.setAttribute("class", "player");
      g.setAttribute("data-id", id);
      g.setAttribute("transform", "translate(" + d.x + "," + d.y + ")");

      var circle = document.createElementNS(SVG_NS, "circle");
      circle.setAttribute("class", "body");
      circle.setAttribute("r", PLAYER_R);
      circle.setAttribute("fill", d.color);

      var text = document.createElementNS(SVG_NS, "text");
      text.textContent = id;

      g.appendChild(circle);
      g.appendChild(text);
      playersLayer.appendChild(g);

      g.addEventListener("pointerdown", function(e){
        if (drawMode) return;
        e.preventDefault();
        e.stopPropagation();
        g.setPointerCapture(e.pointerId);
        dragTarget = { el:g, state:players[id] };
      });
    });
  }

  // ---------- Runners ----------
  function toggleRunner(key){
    runners[key] = !runners[key];
    document.getElementById("runner-" + key).style.display = runners[key] ? "" : "none";
  }
  function setRunners(state){
    runners.first = !!state.first;
    runners.second = !!state.second;
    runners.third = !!state.third;
    document.getElementById("runner-first").style.display = runners.first ? "" : "none";
    document.getElementById("runner-second").style.display = runners.second ? "" : "none";
    document.getElementById("runner-third").style.display = runners.third ? "" : "none";
  }

  document.querySelectorAll(".base-hit").forEach(function(el){
    var key = el.getAttribute("data-base");
    el.addEventListener("pointerdown", function(e){
      if (drawMode) return;
      e.preventDefault();
      e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      var p = svgPoint(e);
      pendingTap = { type:"base", key:key, x0:p.x, y0:p.y };
    });
  });

  // ---------- Outs ----------
  function renderOuts(){
    document.getElementById("out-light-1").setAttribute("fill", outs >= 1 ? "#e63946" : "#3a4a6b");
    document.getElementById("out-light-2").setAttribute("fill", outs >= 2 ? "#e63946" : "#3a4a6b");
  }
  function cycleOuts(){
    outs = (outs + 1) % 3;
    renderOuts();
  }
  var outsBadge = document.getElementById("outs-badge");
  outsBadge.addEventListener("pointerdown", function(e){
    e.preventDefault();
    e.stopPropagation();
    outsBadge.setPointerCapture(e.pointerId);
    var p = svgPoint(e);
    pendingTap = { type:"outs", x0:p.x, y0:p.y };
  });

  // ---------- Ball ----------
  function placeBall(x, y){
    x = clamp(x, PAD_X, MAX_X);
    y = clamp(y, PAD_Y, MAX_Y);
    ballMark.setAttribute("transform", "translate(" + x + "," + y + ")");
  }

  // ---------- Grass: ball placement (tap) or arrow drawing (drag, draw mode) ----------
  grassBg.addEventListener("pointerdown", function(e){
    var p = svgPoint(e);
    e.preventDefault();
    grassBg.setPointerCapture(e.pointerId);
    if (drawMode){
      var line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("class", "arrow");
      line.setAttribute("x1", p.x);
      line.setAttribute("y1", p.y);
      line.setAttribute("x2", p.x);
      line.setAttribute("y2", p.y);
      line.setAttribute("marker-end", "url(#arrowhead)");
      arrowsLayer.appendChild(line);
      drawingArrow = { line:line };
    } else {
      pendingTap = { type:"grass", x0:p.x, y0:p.y };
    }
  });

  // ---------- Shared pointermove / pointerup ----------
  svg.addEventListener("pointermove", function(e){
    if (dragTarget){
      var p = svgPoint(e);
      var x = clamp(p.x, PAD_X, MAX_X);
      var y = clamp(p.y, PAD_Y, MAX_Y);
      dragTarget.state.x = x;
      dragTarget.state.y = y;
      dragTarget.el.setAttribute("transform", "translate(" + x + "," + y + ")");
    } else if (drawingArrow){
      var p2 = svgPoint(e);
      drawingArrow.line.setAttribute("x2", p2.x);
      drawingArrow.line.setAttribute("y2", p2.y);
    }
  });

  function onPointerUp(e){
    if (dragTarget){ dragTarget = null; return; }
    if (drawingArrow){
      var line = drawingArrow.line;
      var dx = parseFloat(line.getAttribute("x2")) - parseFloat(line.getAttribute("x1"));
      var dy = parseFloat(line.getAttribute("y2")) - parseFloat(line.getAttribute("y1"));
      if (Math.hypot(dx, dy) < 12) line.remove();
      drawingArrow = null;
      return;
    }
    if (pendingTap){
      var p = svgPoint(e);
      var dist = Math.hypot(p.x - pendingTap.x0, p.y - pendingTap.y0);
      if (dist < 10){
        if (pendingTap.type === "base") toggleRunner(pendingTap.key);
        else if (pendingTap.type === "outs") cycleOuts();
        else if (pendingTap.type === "grass") placeBall(pendingTap.x0, pendingTap.y0);
      }
      pendingTap = null;
    }
  }
  svg.addEventListener("pointerup", onPointerUp);
  svg.addEventListener("pointercancel", onPointerUp);

  // ---------- Draw-arrow mode toggle ----------
  var btnDraw = document.getElementById("btn-draw");
  btnDraw.addEventListener("click", function(){
    drawMode = !drawMode;
    btnDraw.classList.toggle("active", drawMode);
  });

  // ---------- Clear drawing ----------
  document.getElementById("btn-clear").addEventListener("click", function(){
    arrowsLayer.innerHTML = "";
  });

  // ---------- Reset ----------
  document.getElementById("btn-reset").addEventListener("click", function(){
    buildPlayers();
    setRunners({first:false, second:false, third:false});
    outs = 0;
    renderOuts();
    placeBall(DEFAULT_BALL.x, DEFAULT_BALL.y);
    arrowsLayer.innerHTML = "";
    drawMode = false;
    btnDraw.classList.remove("active");
    document.getElementById("preset-select").value = "";
  });

  // ---------- Preset situations ----------
  var PRESETS = [
    { label:"Bases Empty",           runners:{first:false, second:false, third:false}, outs:0 },
    { label:"Runner on 1st",         runners:{first:true,  second:false, third:false}, outs:0 },
    { label:"Runner on 2nd",         runners:{first:false, second:true,  third:false}, outs:0 },
    { label:"Runner on 3rd",         runners:{first:false, second:false, third:true }, outs:0 },
    { label:"Runners on 1st & 2nd",  runners:{first:true,  second:true,  third:false}, outs:0 },
    { label:"Runners on 1st & 3rd",  runners:{first:true,  second:false, third:true }, outs:0 },
    { label:"Runners on 2nd & 3rd",  runners:{first:false, second:true,  third:true }, outs:1 },
    { label:"Bases Loaded",          runners:{first:true,  second:true,  third:true }, outs:0 },
    { label:"Bases Loaded, 1 Out",   runners:{first:true,  second:true,  third:true }, outs:1 },
    { label:"Bases Loaded, 2 Outs",  runners:{first:true,  second:true,  third:true }, outs:2 },
    { label:"1st & 2nd, 1 Out",      runners:{first:true,  second:true,  third:false}, outs:1 },
    { label:"Runner on 3rd, 1 Out (Infield In)", runners:{first:false, second:false, third:true}, outs:1 }
  ];
  var presetSelect = document.getElementById("preset-select");
  PRESETS.forEach(function(p, i){
    var opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = p.label;
    presetSelect.appendChild(opt);
  });
  presetSelect.addEventListener("change", function(){
    if (presetSelect.value === "") return;
    var p = PRESETS[parseInt(presetSelect.value, 10)];
    setRunners(p.runners);
    outs = p.outs;
    renderOuts();
  });

  // ---------- No-scroll safety net for tablets ----------
  document.addEventListener("touchmove", function(e){
    e.preventDefault();
  }, { passive:false });

  // ---------- Init ----------
  buildPlayers();
  renderOuts();
  placeBall(DEFAULT_BALL.x, DEFAULT_BALL.y);
})();
</script>
</body>
</html>
