<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Baseball Situation Board</title>
<style>
  :root{
    --bg:#0d141c;
    --panel:#16202b;
    --panel-2:#1e2b38;
    --line:#2a3a49;
    --ink:#eaf1f6;
    --muted:#8fa3b3;
    --accent:#e8a33d;      /* infield clay */
    --accent-red:#d7263d;  /* baseball red */
    --field-navy:#16243d;
    --runner:#ef6a2b;
    --chalk:#ffffff;
    --radius:14px;
    --tap:46px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
    height:100dvh;
  }

  /* ---------- Scoreboard header ---------- */
  header{
    background:linear-gradient(180deg,#101922,#0d141c);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  }
  .board{
    display:flex;align-items:center;gap:12px;flex:1 1 340px;min-width:280px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:8px 12px;
  }
  .board .situation{flex:1;min-width:140px;}
  .board .situation label{
    display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin-bottom:2px;
  }
  #situationText{
    width:100%;background:transparent;border:none;color:var(--ink);
    font-size:16px;font-weight:700;letter-spacing:.01em;padding:2px 0;
    outline:none;
  }
  #situationText::placeholder{color:#5b6f7f;font-weight:600;}

  .outs{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:6px 12px;cursor:pointer;user-select:none;min-width:64px;
  }
  .outs .k{font-size:10px;letter-spacing:.16em;color:var(--muted);}
  .outs .num{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;}
  .outs .dots{display:flex;gap:5px;margin-top:3px;}
  .outs .dot{width:9px;height:9px;border-radius:50%;background:#33465a;}
  .outs .dot.on{background:var(--accent-red);box-shadow:0 0 6px rgba(215,38,61,.7);}

  .mini{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;
    display:flex;flex-direction:column;align-items:center;gap:3px;}
  .mini .k{font-size:10px;letter-spacing:.16em;color:var(--muted);}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 100%;
  }
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;}
  .seg button{
    border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:700;letter-spacing:.02em;
    padding:8px 14px;border-radius:9px;min-height:var(--tap);cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:#241a08;box-shadow:0 1px 0 rgba(0,0,0,.3);}
  .seg button[data-tool="arrow"].active{background:#ffd54a;color:#2a2100;}

  .btn{
    border:1px solid var(--line);background:var(--panel);color:var(--ink);
    font-size:13px;font-weight:600;padding:0 14px;height:var(--tap);border-radius:11px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:active{transform:translateY(1px);}
  .btn.ghost{color:var(--muted);}
  select.btn{padding-right:10px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 20px,calc(100% - 11px) 20px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
  .hint{font-size:12px;color:var(--muted);flex:1 1 100%;line-height:1.4;}
  .hint b{color:#cdd8e1;font-weight:700;}

  /* ---------- Field ---------- */
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0;touch-action:none;position:relative;}

  /* floating controls in the dark corners around the field */
  .corner{position:absolute;z-index:6;display:flex;gap:6px;}
  .corner.tl{top:8px;left:8px;}
  .corner.tr{top:8px;right:8px;}
  .corner.bl{bottom:calc(10px + env(safe-area-inset-bottom));left:8px;}
  .corner.br{bottom:calc(10px + env(safe-area-inset-bottom));right:8px;}
  .cbtn{
    border:none;background:#1d4e89;color:#fff;
    font-size:13px;font-weight:800;letter-spacing:.02em;padding:0 16px;height:44px;border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.5);cursor:pointer;touch-action:manipulation;
    display:inline-flex;align-items:center;gap:6px;
  }
  #resetPlayers{background:#7a2323;}
  #checkBtn{background:#7ec8ff;color:#062036;}
  #moreBtn{background:#1e2b38;border:1px solid var(--line);}
  .situation{cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .situation:active .sitlabel{opacity:.7;}
  .situation .chev{color:var(--accent);font-size:12px;}
  .cbtn:active{transform:translateY(1px);}
  select.cbtn{appearance:none;width:auto;min-width:92px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:28px;
    background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
  .cue{
    position:absolute;bottom:calc(64px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
    max-width:66%;z-index:5;pointer-events:none;
    background:rgba(10,17,24,.8);color:#eaf1f6;border:1px solid var(--line);border-radius:20px;
    padding:7px 14px;font-size:13px;font-weight:700;text-align:center;line-height:1.35;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 3px 10px rgba(0,0,0,.4);
    opacity:0;transition:opacity .25s;
  }
  .cue.show{opacity:1;}
  .corner .seg{background:rgba(18,27,37,.82);box-shadow:0 3px 10px rgba(0,0,0,.45);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
  .corner .seg button{touch-action:manipulation;}
  .replay{
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
    width:44px;height:44px;border-radius:10px;font-size:15px;cursor:pointer;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .replay:active{transform:translateY(1px);}
  .seg button[data-tool="quiz"].active{background:#7ec8ff;color:#062036;}
  .panel{
    position:absolute;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:9;
    display:flex;flex-direction:column;gap:6px;
    background:rgba(16,25,34,.95);border:1px solid var(--line);border-radius:14px;padding:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  .pbtn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:13px;font-weight:600;padding:10px 14px;border-radius:10px;cursor:pointer;
    text-align:left;touch-action:manipulation;white-space:nowrap;
  }
  .pbtn:active{transform:translateY(1px);}
  .sheet{position:fixed;inset:0;z-index:30;background:rgba(8,13,19,.78);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    display:flex;align-items:flex-end;}
  .sheet-card{width:100%;max-height:78%;background:var(--panel);
    border-top-left-radius:18px;border-top-right-radius:18px;border:1px solid var(--line);
    display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);}
  .sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .sheet-head .t{flex:1;font-weight:800;font-size:15px;letter-spacing:.01em;}
  .sheet-head button{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    font-size:13px;font-weight:700;height:36px;padding:0 12px;border-radius:9px;cursor:pointer;touch-action:manipulation;}
  .sheet-body{overflow-y:auto;padding:10px;touch-action:pan-y;-webkit-overflow-scrolling:touch;}
  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .catbtn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;
    padding:14px 10px;font-weight:700;font-size:14px;cursor:pointer;text-align:center;touch-action:manipulation;}
  .catbtn small{display:block;color:var(--muted);font-weight:600;font-size:11px;margin-top:3px;}
  .itembtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel-2);
    color:var(--ink);border-radius:11px;padding:13px 12px;margin-bottom:6px;font-size:14px;font-weight:600;
    cursor:pointer;touch-action:manipulation;}
  .itembtn:active,.catbtn:active{transform:translateY(1px);}
  .sitlabel{min-height:22px;font-size:16px;font-weight:700;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #kidBar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));
    display:none;justify-content:center;gap:10px;z-index:12;padding:0 10px;pointer-events:none;}
  .kbtn{flex:1;max-width:150px;height:58px;border-radius:16px;border:1px solid var(--line);
    font-size:16px;font-weight:800;color:#fff;cursor:pointer;touch-action:manipulation;
    box-shadow:0 4px 14px rgba(0,0,0,.45);letter-spacing:.02em;pointer-events:auto;}
  .kbtn:active{transform:translateY(2px);}
  #kidWatch{background:#1d4e89;}
  #kidNext{background:#e8a33d;color:#241a08;}
  #kidQuizBtn{background:#7ec8ff;color:#062036;}
  body.kid #kidBar{display:flex;}
  body.kid .corner.tl,body.kid .corner.bl,body.kid .corner.tr{display:none;}
  body.kid .corner.br{bottom:calc(84px + env(safe-area-inset-bottom));}
  body.kid #replayBtn,body.kid #nextBtn,body.kid #checkBtn{display:none;}
  body.kid .cue{bottom:calc(128px + env(safe-area-inset-bottom));}
  body.kid .panel{bottom:calc(130px + env(safe-area-inset-bottom));}
  #flashOk{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;z-index:25;opacity:0;}
  #flashOk .bg{position:absolute;inset:0;background:rgba(53,208,127,.22);}
  #flashOk .mk{position:relative;font-size:120px;font-weight:900;color:#35d07f;
    text-shadow:0 4px 18px rgba(0,0,0,.55);}
  #flashOk.go{animation:flashok .85s ease;}
  @keyframes flashok{0%{opacity:0;}15%{opacity:1;}70%{opacity:1;}100%{opacity:0;}}

  svg#field{width:100%;height:100%;touch-action:none;display:block;}
  svg#field *{touch-action:none;}
  .fielder{cursor:grab;}
  .fielder:active{cursor:grabbing;}
  /* overlays must not intercept taps meant for bases/grass/players */
  #ballLayer,#trailLayer,#arrowsLayer,#previewLayer{pointer-events:none;}
  .runnerTok{cursor:grab;}
  .runnerTok:active{cursor:grabbing;}
  text{user-select:none;-webkit-user-select:none;}

  @media (max-width:560px){
    header{padding:6px 8px;gap:6px;}
    .board{flex:1 1 100%;gap:8px;padding:6px 8px;}
    .board .situation label{display:none;}
    .mini{display:none;}
    #situationText{font-size:14px;}
    .replay{width:40px;height:40px;}
    .outs{flex-direction:row;gap:6px;padding:6px 10px;min-width:0;}
    .outs .dots{margin-top:0;}
    .seg button{padding:7px 11px;min-height:40px;}
    .cbtn{height:40px;padding:0 12px;font-size:12px;}
    .corner.tl,.corner.tr{top:6px;} .corner.tl{left:6px;} .corner.tr{right:6px;}
    .corner.bl,.corner.br{bottom:calc(8px + env(safe-area-inset-bottom));} .corner.bl{left:6px;} .corner.br{right:6px;}
    .stage{padding:0;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="board">
    <div class="situation" id="playPicker" role="button" tabindex="0" title="Pick a play">
      <label>Situation <span class="chev">&#9662; tap to pick</span></label>
      <div id="situationText" class="sitlabel">Tap here to pick a play</div>
    </div>

    <div class="mini">
      <div class="k">BASES</div>
      <svg width="42" height="42" viewBox="0 0 42 42" id="miniBases" aria-hidden="true">
        <rect id="mb-home" x="17" y="30" width="8" height="8" rx="1.5" transform="rotate(45 21 34)" fill="none" stroke="#4a5e70" stroke-width="1.5"/>
        <rect id="mb-1"   x="30" y="17" width="9" height="9" rx="1.5" transform="rotate(45 34.5 21.5)" fill="#33465a"/>
        <rect id="mb-2"   x="16.5" y="4" width="9" height="9" rx="1.5" transform="rotate(45 21 8.5)" fill="#33465a"/>
        <rect id="mb-3"   x="3" y="17" width="9" height="9" rx="1.5" transform="rotate(45 7.5 21.5)" fill="#33465a"/>
      </svg>
    </div>

    <button id="replayBtn" class="replay" title="Replay movement" aria-label="Replay">&#9654;</button>
    <button id="nextBtn" class="replay" title="Next situation" aria-label="Next">&#187;</button>

    <div class="outs" id="outsBox" role="button" tabindex="0" title="Tap to change outs">
      <div class="k">OUTS</div>
      <div class="num" id="outsNum">0</div>
      <div class="dots"><span class="dot" data-i="0"></span><span class="dot" data-i="1"></span></div>
    </div>
  </div>
</header>

<div class="stage">
  <svg id="field" viewBox="150 165 700 800" preserveAspectRatio="xMidYMid meet" aria-label="Baseball field">
    <defs>
      <clipPath id="fairClip">
        <path d="M 500 880 L 5 385 A 700 700 0 0 1 995 385 Z"/>
      </clipPath>
      <marker id="arrowHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#ffd54a" stroke="#7a5c00" stroke-width="0.6"/>
      </marker>
      <marker id="throwHead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#ffffff" stroke="#444" stroke-width="0.6"/>
      </marker>
      <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
      </filter>
      <filter id="tokenShadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#06140c" flood-opacity="0.5"/>
      </filter>
      <linearGradient id="tokenSheen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
        <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="vignette" cx="50%" cy="60%" r="72%">
        <stop offset="0" stop-color="#000000" stop-opacity="0"/>
        <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
      </radialGradient>
    </defs>

    <!-- beyond the fence -->
    <rect x="-1000" y="-1000" width="3000" height="3000" fill="#0d141c"/>

    <!-- fair territory grass + warning track + mow rings (clipped to the fair wedge) -->
    <g clip-path="url(#fairClip)">
      <circle cx="500" cy="880" r="700" fill="#c68a4e"/> <!-- warning track base -->
      <g id="grassRings"></g>
    </g>

    <!-- fence -->
    <path d="M 5 385 A 700 700 0 0 1 995 385" fill="none" stroke="#12331f" stroke-width="10" stroke-linecap="round"/>
    <path d="M 5 385 A 700 700 0 0 1 995 385" fill="none" stroke="#eecb59" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>

    <!-- depth vignette (over grass only) -->
    <rect x="0" y="0" width="1000" height="1000" fill="url(#vignette)" pointer-events="none"/>

    <!-- infield dirt skin (rounded: semicircular grass line) -->
    <path d="M 500 916 L 746 670 A 246 246 0 0 0 254 670 Z"
          fill="#c58a54" stroke="#a56a37" stroke-width="5" stroke-linejoin="round"/>
    <!-- infield grass (diamond between the base paths) -->
    <path d="M 500 510 L 660 670 L 500 830 L 340 670 Z" fill="#348a3d" stroke="#2c7a35" stroke-width="2"/>
    <!-- home dirt circle, batter's boxes, catcher's box -->
    <circle cx="500" cy="880" r="58" fill="#c58a54"/>
    <rect x="450" y="854" width="27" height="46" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>
    <rect x="523" y="854" width="27" height="46" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" opacity=".85"/>
    <path d="M 482 904 L 482 926 M 518 904 L 518 926" stroke="#ffffff" stroke-width="2.5" opacity=".65" fill="none"/>
    <!-- pitcher's mound -->
    <circle cx="500" cy="662" r="36" fill="#d29a5f" stroke="#b47c46" stroke-width="2"/>
    <rect x="486" y="658" width="28" height="8" rx="2" fill="#f2f4f6"/>

    <!-- foul lines -->
    <line x1="500" y1="880" x2="995" y2="385" stroke="#ffffff" stroke-width="5"/>
    <line x1="500" y1="880" x2="5"   y2="385" stroke="#ffffff" stroke-width="5"/>

    <!-- bases -->
    <rect x="697" y="657" width="26" height="26" rx="2.5" transform="rotate(45 710 670)" fill="#fff" stroke="#d7dde2"/>
    <rect x="487" y="447" width="26" height="26" rx="2.5" transform="rotate(45 500 460)" fill="#fff" stroke="#d7dde2"/>
    <rect x="277" y="657" width="26" height="26" rx="2.5" transform="rotate(45 290 670)" fill="#fff" stroke="#d7dde2"/>
    <!-- home plate -->
    <path d="M 485 865 L 515 865 L 515 884 L 500 897 L 485 884 Z" fill="#fff" stroke="#d7dde2"/>

    <!-- interactive base tap zones (above field, below players) -->
    <g id="baseZones">
      <circle data-base="1" cx="710" cy="670" r="46" fill="transparent"/>
      <circle data-base="2" cx="500" cy="460" r="46" fill="transparent"/>
      <circle data-base="3" cx="290" cy="670" r="46" fill="transparent"/>
    </g>

    <!-- dynamic layers -->
    <g id="arrowsLayer"></g>
    <g id="previewLayer"></g>
    <g id="runnersLayer"></g>
    <g id="trailLayer"></g>
    <g id="ballLayer"></g>
    <g id="fieldersLayer"></g>
  </svg>

  <div class="corner tl">
    <div class="seg" role="group" aria-label="Tool">
      <button data-tool="move" class="active">Move</button>
      <button data-tool="arrow">Arrow</button>
      <button data-tool="quiz">Quiz</button>
    </div>
  </div>
  <div class="corner bl">
    <button class="cbtn" id="resetPlayers">Reset</button>
  </div>
  <div class="corner br">
    <button class="cbtn" id="checkBtn" style="display:none">Check</button>
    <button class="cbtn" id="moreBtn" aria-label="More options">&#8943;</button>
  </div>
  <div class="panel" id="morePanel" style="display:none">
    <button class="pbtn" id="kidBtn">Kid Mode: Off</button>
    <button class="pbtn" id="stepBtn">Step through play &#9654;</button>
    <button class="pbtn" id="clearMarks">Clear arrows</button>
    <button class="pbtn" id="focusBtn">Focus: Off</button>
    <button class="pbtn" id="roverBtn">4th outfielder: Off</button>
    <button class="pbtn" id="savePlayBtn">Save this play</button>
    <button class="pbtn" id="delPlayBtn">Delete a saved play</button>
  </div>
  <div class="cue" id="cueBar" aria-live="polite"></div>
</div>

<div id="kidBar">
  <button class="kbtn" id="kidWatch">WATCH</button>
  <button class="kbtn" id="kidNext">NEXT</button>
  <button class="kbtn" id="kidQuizBtn">QUIZ ME</button>
</div>
<div id="flashOk"><div class="bg"></div><div class="mk">&#10003;</div></div>

<div class="sheet" id="pickSheet" style="display:none">
  <div class="sheet-card">
    <div class="sheet-head">
      <button id="sheetBack" style="display:none">&#8249; Back</button>
      <span class="t" id="sheetTitle">Pick a category</span>
      <button id="sheetClose">&#10005;</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var svg = document.getElementById('field');
  var NS = "http://www.w3.org/2000/svg";

  /* ---------- geometry ---------- */
  var HOME={x:500,y:880}, FIRST={x:710,y:670}, SECOND={x:500,y:460}, THIRD={x:290,y:670};
  var BASE_XY={1:FIRST,2:SECOND,3:THIRD};

  /* ---------- mow rings ---------- */
  var rings=document.getElementById('grassRings');
  var A="#3c8f42", B="#2f7c37", i=0;
  for(var r=660;r>=60;r-=66){
    var c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',500);c.setAttribute('cy',880);c.setAttribute('r',r);
    c.setAttribute('fill', (i%2===0)?A:B);
    rings.appendChild(c); i++;
  }

  /* ---------- state ---------- */
  var fielders=[
    {id:'LF',x:300,y:335},{id:'CF',x:500,y:262},{id:'RF',x:700,y:335},
    {id:'SS',x:388,y:482},{id:'2B',x:612,y:482},
    {id:'3B',x:330,y:616},{id:'1B',x:670,y:616},
    {id:'P',x:500,y:662},{id:'C',x:500,y:928}
  ];

    sheetTitle.textContent=g.name;

      var b=document.createElement('button'); b.className='itembtn';
      b.textContent=it.label;
      b.addEventListener('click',function(){ closeSheet(); loadChoice(it.v); });

  function tween(items,dur,done){
    var start=null;
    function ease(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }
    function stepF(ts){
      if(start===null) start=ts;
      var t=Math.min(1,(ts-start)/dur), e=ease(t);
      items.forEach(function(m){ m.set(m.x0+(m.x1-m.x0)*e, m.y0+(m.y1-m.y0)*e); });
      if(t<1){ animRAF=requestAnimationFrame(stepF); } else { animRAF=null; if(done) done(); }
    }
    stopAnim(); animRAF=requestAnimationFrame(stepF);
  }

      if(bNode) bNode.setAttribute('transform','translate('+x+','+y+') scale('+(scale||1)+')');
      if(++trailTick%3===0){
        var d=el('circle',{cx:x,cy:y,r:5,fill:'#ffffff',opacity:0.4});
        tLayer.appendChild(d);
        setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); },420);
      }
    };
  }
  function near(a,b,d){ return Math.hypot(a.x-b.x,a.y-b.y)<d; }

  function computeMovers(pre){
    var movers=[], runA=[], moves=pre.moves||{};
    Object.keys(moves).forEach(function(id){
      var f=getFielder(id); if(!f) return;
      var d=defaultOf(id), t=moves[id];
      if(Math.hypot(t.x-d.x,t.y-d.y)>6){ runA.push({x1:d.x,y1:d.y,x2:t.x,y2:t.y}); }
      movers.push({f:f,x0:d.x,y0:d.y,x1:t.x,y1:t.y});
    });
    return {movers:movers,runArrows:runA};
  }

  /*SEQ_START*/
  function buildSeq(pre){
    var cueTxt=(CUES[pre.name]||pre.cue||'');
    var mv=pre.moves||{}, ids=Object.keys(mv);
    var backs=[AT.backFirst,AT.backThird,AT.backSecond,AT.backHome];
    var recv={};
    Object.keys(BASEPTS).forEach(function(k){
      ids.forEach(function(id){ if(near(mv[id],BASEPTS[k],16)) recv[k]=true; });
    });
    var order=[], m, re=/(?:→|to|at|fires?|throws?|flips?)\s+(?:the\s+)?(1st|1b|2nd|3rd|3b|home|plate)/gi;
    while((m=re.exec(cueTxt))){
      var k=BASEWORD[m[1].toLowerCase()];
      if(k&&recv[k]&&order.indexOf(k)<0) order.push(k);
    }
    if(!order.length){
      ['second','home','third','first'].some(function(k){ if(recv[k]){ order.push(k); return true; } });
      if(order.length&&order[0]!=='first'&&recv['first']&&order.indexOf('first')<0) order.push('first');
    }
    var chain=order.map(function(k){ return {x:BASEPTS[k].x,y:BASEPTS[k].y}; });
    if(pre.ball && chain.length){
      var bd=Math.hypot(pre.ball.x-HOME.x,pre.ball.y-HOME.y);
      if(bd>380){
        var cut=null;
        ids.forEach(function(id){
          if(cut) return;
          var t=mv[id];
          var isBase=Object.keys(BASEPTS).some(function(k2){ return near(t,BASEPTS[k2],16); });
          var isBack=backs.some(function(b){ return near(t,b,16); });
          if(!isBase && !isBack && !near(t,pre.ball,34)) cut={x:t.x,y:t.y};
        });
        if(cut) chain.unshift(cut);
      }
    }
    var from=null;
    if(!pre.ball && chain.length){
      var thrower=(/pickoff: p|p spins|p snaps/i.test(pre.name+' '+cueTxt))?'P':'C';
      var d2=defaultOf(thrower); from={x:d2.x,y:d2.y};
    }
    return {chain:chain, from:from};
  }
  /*SEQ_END*/

  function runnerPt(b){
    if(b==='H') return {x:AT.home.x, y:AT.home.y};
    var base=BASE_XY[b];
    var dx=HOME.x-base.x, dy=HOME.y-base.y, len=Math.hypot(dx,dy);
    return {x:base.x+dx/len*20, y:base.y+dy/len*20};
  }
  function mkRunnerToken(p){
    var g=el('g',{'transform':'translate('+p.x+','+p.y+')','filter':'url(#tokenShadow)','pointer-events':'none'});
    drawHelmet(g);
    rLayer.appendChild(g);
    return g;
  }

  function buildTimeline(pre){
    var legs=[];
    if(pre.ball) legs.push({t:'hit', from:{x:HOME.x,y:HOME.y-16}, to:{x:pre.ball.x,y:pre.ball.y}});
    var cm=computeMovers(pre);
    if(cm.movers.length) legs.push({t:'move', movers:cm.movers});
    var runs=(pre.rmoves||[]).slice();
    if(!runs.length && pre.ball && /fly balls|pop-ups/i.test(pre.g||'')){
      var lead=[];
      [1,2,3].forEach(function(b){
        if((pre.runners||[]).indexOf(b)>=0){ lead.push({a:b, b:(b===3?'H':b+1), lead:true}); }
      });
      if(lead.length) runs=lead;
    }
    if(runs.length) legs.push({t:'run', runs:runs});
    var seq=buildSeq(pre);
    var cur = pre.ball ? {x:pre.ball.x,y:pre.ball.y} : seq.from;
    if(cur){ seq.chain.forEach(function(p){ legs.push({t:'throw', from:cur, to:p}); cur=p; }); }
    return legs;
  }
  function throwArrowsFrom(legs){
    var out=[];
    legs.forEach(function(l){ if(l.t==='throw') out.push({x1:l.from.x,y1:l.from.y,x2:l.to.x,y2:l.to.y}); });
    return out;
  }

  function prepStart(pre){
    stopAnim();
    defaults.forEach(function(d){ var f=getFielder(d.id); f.x=d.x; f.y=d.y; setFielderPos(f); });
    runners={1:false,2:false,3:false};
    (pre.runners||[]).forEach(function(b){ runners[b]=true; });
    hiddenRunnerBases={}; runnersPos={};
    ball = pre.ball ? {x:pre.ball.x,y:pre.ball.y} : null;
    renderRunners(); renderBall();
  }

  function finishRun(toks,wasHalf){
    toks.forEach(function(o){
      o.tok.remove();
      delete hiddenRunnerBases[o.r.a];
      if(!wasHalf){ runners[o.r.a]=false; if(o.r.b!=='H') runners[o.r.b]=true; }
    });
    renderRunners();
  }
  function runLeg(leg,done){
    if(leg.t==='hit'){
      ball={x:leg.from.x,y:leg.from.y}; renderBall();
      tween([{set:ballSetter(1.25),x0:leg.from.x,y0:leg.from.y,x1:leg.to.x,y1:leg.to.y}],460,function(){ renderBall(); if(done) done(); });
    } else if(leg.t==='move'){
      var items=leg.movers.map(function(mv){
        return {set:(function(f){return function(x,y){ f.x=x; f.y=y; setFielderPos(f); };})(mv.f),
                x0:mv.x0,y0:mv.y0,x1:mv.x1,y1:mv.y1};
      });
      tween(items,900,done);
    } else if(leg.t==='throw'){
      if(!ball){ ball={x:leg.from.x,y:leg.from.y}; renderBall(); }
      tween([{set:ballSetter(1.3),x0:leg.from.x,y0:leg.from.y,x1:leg.to.x,y1:leg.to.y}],380,function(){ renderBall(); if(done) done(); });
    } else if(leg.t==='run'){
      var toks=[], ritems=[];
      leg.runs.forEach(function(r){
        var p0=runnerPt(r.a);
        var pEnd=runnerPt(r.b);
        var frac=r.half?0.5:(r.lead?0.3:1);
        var p1=(frac<1) ? {x:p0.x+(pEnd.x-p0.x)*frac, y:p0.y+(pEnd.y-p0.y)*frac} : pEnd;
        hiddenRunnerBases[r.a]=true;
        var tok=mkRunnerToken(p0); toks.push({tok:tok,r:r});
        ritems.push({set:(function(tk){return function(x,y){ tk.setAttribute('transform','translate('+x+','+y+')'); };})(tok),
                     x0:p0.x,y0:p0.y,x1:p1.x,y1:p1.y});
      });
      renderRunners();
      tween(ritems,700,function(){
        var halves=leg.runs.some(function(r){ return r.half||r.lead; });
        if(halves){
          var back=ritems.map(function(it){ return {set:it.set,x0:it.x1,y0:it.y1,x1:it.x0,y1:it.y0}; });
          tween(back,600,function(){ finishRun(toks,true); if(done) done(); });
        } else { finishRun(toks,false); if(done) done(); }
      });
    } else { if(done) done(); }
  }

  function playAll(){
    if(!currentSituation) return;
    prepStart(currentSituation);
    tlIndex=0;
    (function nextLeg(){
      if(tlIndex>=timeline.length) return;
      runLeg(timeline[tlIndex++], nextLeg);
    })();
  }
  function stepOnce(){
    if(!currentSituation||!timeline.length) return;
    if(tlIndex===0||tlIndex>=timeline.length){ prepStart(currentSituation); tlIndex=0; }
    runLeg(timeline[tlIndex++], null);
  }

  /* ---------- quiz ---------- */
  var checkBtn=document.getElementById('checkBtn');

  function setTokenStroke(f,color,w){

        total++;
        var t=quizState.targets[id];
        var ok=Math.hypot(f.x-t.x,f.y-t.y)<=62;
        if(ok) good++;
        setTokenStroke(f, ok?'#35d07f':'#ff5d5d', 5);
      });

      arrows=quizState.runArrows.slice(); throwArrows=quizState.throwArrows.slice(); renderArrows();
      cueEl.textContent='You got '+good+' of '+total+' — tap ANSWER to watch the play';
      cueEl.classList.add('show');

  /* ---------- load a situation ---------- */
  function loadSituation(pre, animate, quiz){
    stopAnim();
    currentSituation=pre;

    outs=pre.outs||0;
    situationInput.textContent=pre.name;
    clearTokenMarks();

    var cm=computeMovers(pre);
    var tArrows=throwArrowsFrom(timeline);
    if(quiz){
      arrows=[]; throwArrows=[]; renderArrows(); renderOuts();
      var targets={}; cm.movers.forEach(function(m){ targets[m.f.id]={x:m.x1,y:m.y1}; });
      if(quiz==='kid'){
        var star=pickStar(pre,targets);
        quizState={mode:'kid',pre:pre,targets:targets,star:star,tries:0,runArrows:cm.runArrows,throwArrows:tArrows,phase:1};
        kidDim(star);
        cueEl.textContent="YOU'RE THE "+star+" \u2014 where do you go?";
        cueEl.classList.add('show');
        setKidQuizLabel('CHECK');
      } else {
        quizState={mode:'full',targets:targets,runArrows:cm.runArrows,throwArrows:tArrows,phase:1};
        cueEl.textContent='Your turn: drag each player where he goes, then tap CHECK';
        cueEl.classList.add('show');
      }
      updateCheckBtn();
      return;
    }
    quizState=null; updateCheckBtn();
    arrows=cm.runArrows.slice(); throwArrows=tArrows; renderArrows(); renderOuts();
    cueEl.textContent = CUES[pre.name] || pre.cue || pre.name || '';
    cueEl.classList.toggle('show', !!cueEl.textContent);
    if(animate){ playAll(); }
    else { cm.movers.forEach(function(m){ m.f.x=m.x1; m.f.y=m.y1; setFielderPos(m.f); }); }
  }

  function applySaved(sp){
    stopAnim(); currentSituation=null; timeline=[]; tlIndex=0; quizState=null; updateCheckBtn();

  /* ---------- 4th outfielder ---------- */
  var OF3={LF:{x:300,y:335},CF:{x:500,y:262},RF:{x:700,y:335}};
  var OF4={LF:{x:262,y:382},LC:{x:420,y:272},CF:{x:582,y:272},RF:{x:740,y:382}};

  var kidQuizBtnEl=document.getElementById('kidQuizBtn');

  function kidDim(star){

  function kidCheck(){

        kidStreak=0;
        pLayer.textContent='';
        arrows=[{x1:defaultOf(q.star).x,y1:defaultOf(q.star).y,x2:t.x,y2:t.y}]; renderArrows();
        cueEl.textContent='Right here \u2014 '+kidCommand(q.pre,t);
        cueEl.classList.add('show');
        var ff=f;
        tween([{set:function(x,y){ ff.x=x; ff.y=y; setFielderPos(ff); },x0:ff.x,y0:ff.y,x1:t.x,y1:t.y}],700,null);
        quizState=null; setKidQuizLabel('QUIZ ME');
        setTimeout(kidUndim,900);
      }
    }
  }

  /* ---------- reset ---------- */
  document.getElementById('resetPlayers').addEventListener('click',function(){
    stopAnim();
    defaults.forEach(function(d){ var f=getFielder(d.id); f.x=d.x; f.y=d.y; setFielderPos(f); });
    runners={1:false,2:false,3:false}; outs=0; ball=null; arrows=[]; throwArrows=[];
    hiddenRunnerBases={}; runnersPos={}; timeline=[]; tlIndex=0;
    situationInput.textContent='Tap here to pick a play'; currentSituation=null; curIndex=-1;
    quizState=null; updateCheckBtn(); clearTokenMarks(); applyFocus();
    cueEl.textContent=''; cueEl.classList.remove('show');
    renderRunners(); renderOuts(); renderBall(); renderArrows();
  });


  /* ---------- fit field to screen (kill letterboxing) ---------- */
  var stageEl=document.querySelector('.stage');
  var CONTENT={x:190,y:172,w:620,h:794};
  function fitView(){
    var r=stageEl.getBoundingClientRect();
    if(r.width<20||r.height<20) return;
    var ar=r.width/r.height, x=CONTENT.x, y=CONTENT.y, w=CONTENT.w, h=CONTENT.h;
    if(ar > w/h){ var nw=h*ar; x-=(nw-w)/2; w=nw; }
    else { var nh=w/ar; y-=(nh-h)*0.42; h=nh; }
    svg.setAttribute('viewBox', x.toFixed(1)+' '+y.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
  }
  window.addEventListener('resize', fitView);
  window.addEventListener('orientationchange', fitView);
  if(window.ResizeObserver){ new ResizeObserver(fitView).observe(stageEl); }

  /* ---------- init ---------- */
  buildFielders();
  if(roverOn) setRover(true,true);
  if(kidOn) setKid(true,true);
  applyFocus(); updateCheckBtn();
  renderRunners(); renderBall(); renderArrows(); renderOuts();
  fitView();
})();
</script>
</body>
</html>
